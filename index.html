    <script>
      (() => {
        const format = new Intl.DateTimeFormat("en-US", {
          timeZone: "America/Toronto",
          hour: "numeric",
          minute: "2-digit",
          hour12: true,
          timeZoneName: "short",
        });

        const clock = document.getElementById("time__clock");
        const timezone = document.getElementById("time__timezone");

        const tick = () => {
          const now = new Date();

          const parts = {};
          for (const part of format.formatToParts(now))
            parts[part.type] = part.value;

          clock.textContent = `${parts.hour}:${parts.minute} ${parts.dayPeriod}`;
          timezone.textContent = parts.timeZoneName;
        };

        const loop = () => {
          tick();
          setTimeout(loop, 60000 - (Date.now() % 60000) + 25);
        };

        loop();
        document.addEventListener("visibilitychange", tick);
      })();
    </script>
